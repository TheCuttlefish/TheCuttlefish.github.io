<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- Home Screen name -->
  <title>GET 3.000</title>
  <meta name="apple-mobile-web-app-title" content="GET 3.000">

  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/3000/favIcon-180-2.png">

  <!-- App-like mobile behavior -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <!-- Optional favicon for browsers -->
  <link rel="icon" href="/3000/favIcon-180-2.png">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
      gap: 16px;
      text-align: center;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sub {
      font-size: 14px;
      opacity: 0.8;
      max-width: 28rem;
      line-height: 1.4;
    }

    .btn {
      display: inline-block;
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.10);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.4px;
      min-width: 220px;
    }

    .tiny {
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">GET 3.000</div>
    <div class="sub">
      Tap PLAY to open the game.
    </div>

    <a class="btn"
       href="https://zhan.itch.io/time-to-three"
       target="_self"
       rel="noopener">
      PLAY
    </a>

    <div class="tiny">
      (For best results, open from the Home Screen icon.)
    </div>
  </div>
</body>
</html>

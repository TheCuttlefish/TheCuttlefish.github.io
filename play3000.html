<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- Home Screen name -->
  <title>GET 3.000</title>
  <meta name="apple-mobile-web-app-title" content="GET 3.000">

  <!-- iOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/3000/favIcon-180-2.png">

  <!-- Mobile / app-like behavior -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <!-- Optional favicon for browsers -->
  <link rel="icon" href="/3000/favIcon-180-2.png">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        16px
        max(24px, env(safe-area-inset-bottom));
      gap: 16px;
      text-align: center;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .sub {
      font-size: 14px;
      opacity: 0.8;
      max-width: 30rem;
      line-height: 1.4;
    }

    /* Responsive iframe wrapper */
    .frame {
      width: min(560px, 100%);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
    }

    /* Match itch widget default height but scale nicely */
    .frame iframe {
      display: block;
      width: 100%;
      height: 167px;
      border: 0;
    }

    .tiny { font-size: 12px; opacity: 0.6; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">GET 3.000</div>
    <div class="sub">
      Tap the button in the widget to open/play on itch.
    </div>

    <div class="frame">
      <iframe
        frameborder="0"
        src="https://itch.io/embed/4100083"
        allow="fullscreen; autoplay; gamepad"
      >
        <a href="https://zhan.itch.io/time-to-three">Time To Three by Zhan</a>
      </iframe>
    </div>
    <iframe frameborder="0" src="https://itch.io/embed/4100083?bg_color=030301&amp;fg_color=e9f5fb&amp;link_color=fedd62&amp;border_color=474e52" width="552" height="167"><a href="https://zhan.itch.io/time-to-three">Time To Three by Zhan</a></iframe>
    <div class="tiny">
      If iOS shows the old icon/name, delete the Home Screen shortcut and add it again.
    </div>
  </div>
</body>
</html>
